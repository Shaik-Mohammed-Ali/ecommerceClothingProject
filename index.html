<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Our Clothing Store</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#shop">Shop</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="shop">
        <h2>Our Products</h2>
        <div class="product" id="product1">
            <img src="./images/basic-tee" alt="">
            <h3>T-Shirt</h3>
            <p>Price: $20</p>
            <button onclick="addToBag('T-Shirt', 20)">Add to Bag</button>
        </div>
        <div class="product" id="product2">
            <img src="./images/basic-tee" alt="">
            <h3>Jeans</h3>
            <p>Price: $50</p>
            <button onclick="addToBag('Jeans', 50)">Add to Bag</button>
        </div>
        <div class="product" id="product3">
            <img src="./images/basic-tee" alt="">
            <h3>Jacket</h3>
            <p>Price: $100</p>
            <button onclick="addToBag('Jacket', 100)">Add to Bag</button>
        </div>
    </main>

    <aside>
        <h2>Shopping Bag</h2>
        <ul id="bagItems"></ul>
        <p id="totalAmount">Total: $0</p>
        <button onclick="proceedToPayment()">Proceed to Payment</button>
    </aside>

    <script src="script.js"></script>
</body>
</html>
